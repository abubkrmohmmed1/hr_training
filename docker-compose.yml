version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: nmareg_postgres
    restart: always
    environment:
      POSTGRES_USER: nmareg
      POSTGRES_PASSWORD: nmareg_secure_password
      POSTGRES_DB: nmareg_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nmareg -d nmareg_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nmareg_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://nmareg:nmareg_secure_password@db:5432/nmareg_db
      SECRET_KEY: e83a71b2d9f4859a1639c0d2938475a1b2c3d4e5f60718293a4b5c6d7e8f9012
      MODEL_SIGNING_KEY: 4a5b6c7d8e9f0123456789abcdef0123456789abcdef0123456789abcdef0123
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      ALLOWED_ORIGINS: http://127.0.0.1:8000,http://localhost:8000,http://localhost:3000
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./frontend:/frontend

volumes:
  postgres_data:
