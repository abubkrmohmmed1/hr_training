<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لوحة الموظف</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-header"><div class="logo">ن</div><div class="brand-text">نظام التدريب الذكي</div></div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer"><button class="btn btn-ghost logout-btn" id="logout-btn">تسجيل الخروج</button></div>
    </aside>
    <div class="main-content">
      <header class="top-header">
        <div class="header-right">
          <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="القائمة">☰</button>
          <h1 class="header-title">لوحتي</h1>
        </div>
        <div class="header-left">
          <div class="user-info">
            <div><div class="text-title" id="user-name">—</div><small class="text-muted" id="user-role"></small></div>
            <div class="avatar" id="user-avatar">أ</div>
          </div>
        </div>
      </header>
      <main class="page-content">
        <section class="kpi-grid">
          <article class="kpi-card"><div class="kpi-info"><div class="kpi-value" id="kpi-courses">0</div><div class="kpi-label">دورات في خطتك</div></div><div class="kpi-icon blue">د</div></article>
          <article class="kpi-card"><div class="kpi-info"><div class="kpi-value" id="kpi-assess">0</div><div class="kpi-label">تقييم مكتمل</div></div><div class="kpi-icon green">ت</div></article>
          <article class="kpi-card"><div class="kpi-info"><div class="kpi-value" id="kpi-progress">0%</div><div class="kpi-label">تقدمك الإجمالي</div></div><div class="kpi-icon purple">ن</div></article>
        </section>
        <section class="grid-2">
          <article class="card">
            <div class="card-header"><h3>خطة التدريب الحالية</h3></div>
            <div class="card-body" id="plan-list"></div>
          </article>
          <article class="card">
            <div class="card-header"><h3>الفجوات المهارية</h3></div>
            <div class="card-body" id="gap-list"></div>
          </article>
        </section>
        <section class="card mb-xl" id="actual-impact-card">
          <div class="card-header"><h3>أثر التدريب الفعلي على المهارات</h3></div>
          <div class="card-body" id="actual-impact"></div>
        </section>
        <section class="card">
          <div class="card-header"><h3>تنبيهات</h3></div>
          <div class="card-body" id="notif-list"></div>
        </section>
      </main>
    </div>
  </div>
  <script type="module">
    import { initEmployeePage } from '/js/pages/employee.js';
    initEmployeePage();
  </script>
</body>
</html>
