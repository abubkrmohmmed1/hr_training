<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>التقييم الذاتي</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-header"><div class="logo">ن</div><div class="brand-text">نظام التدريب الذكي</div></div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer"><button class="btn btn-ghost logout-btn" id="logout-btn">تسجيل الخروج</button></div>
    </aside>
    <div class="main-content">
      <header class="top-header">
        <div class="header-right">
          <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="القائمة">☰</button>
          <h1 class="header-title">التقييم الذاتي للمهارات</h1>
        </div>
        <div class="header-left">
          <div class="user-info">
            <div><div class="text-title" id="user-name">—</div><small class="text-muted" id="user-role"></small></div>
            <div class="avatar" id="user-avatar">أ</div>
          </div>
        </div>
      </header>
      <main class="page-content">
        <div class="info-banner">قيّم نفسك بصدق حتى يتمكن النموذج من اقتراح دورات مناسبة.</div>
        <div class="progress-banner">
          <span id="assess-progress-label">تقدمك في التقييم</span>
          <div class="progress-bar-container">
            <div class="progress-bar-track"><div class="progress-bar-fill green" id="assess-progress-fill" style="width:0%"></div></div>
          </div>
        </div>
        <div id="assess-grid"></div>
        <div class="plan-actions">
          <button class="btn btn-success" id="submit-self">إرسال التقييم وتوليد الخطة</button>
        </div>
      </main>
    </div>
  </div>
  <script type="module">
    import { initEmployeeAssessPage } from '/js/pages/employee-assess.js';
    initEmployeeAssessPage();
  </script>
</body>
</html>
