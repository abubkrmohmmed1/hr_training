<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول — نظام تدريب الموظفين</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="login-page">
    <section class="login-card">
      <div class="login-logo" aria-hidden="true">ن</div>
      <h1 class="login-title">نظام تدريب الموظفين الذكي</h1>
      <p class="login-subtitle">جامعة النيلين — كلية الدراسات العليا</p>
      <div id="login-error" class="login-error" role="alert"></div>
      <form id="login-form" class="login-form">
        <div class="form-group">
          <label class="form-label" for="email">البريد الإلكتروني</label>
          <input class="form-input" id="email" type="email" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">كلمة المرور</label>
          <input class="form-input" id="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary login-btn" type="submit">تسجيل الدخول</button>
      </form>
      <div class="demo-accounts">
        <button type="button" class="demo-chip" data-email="admin@nmareg.com"><strong>مدير النظام</strong>admin@nmareg.com</button>
        <button type="button" class="demo-chip" data-email="hr@nmareg.com"><strong>الموارد البشرية</strong>hr@nmareg.com</button>
        <button type="button" class="demo-chip" data-email="manager@nmareg.com"><strong>المدير المباشر</strong>manager@nmareg.com</button>
        <button type="button" class="demo-chip" data-email="employee@nmareg.com"><strong>الموظف</strong>employee@nmareg.com</button>
      </div>
      <p class="login-footer">كلمة المرور التجريبية: 123456</p>
    </section>
  </main>
  <script type="module">
    import { initLoginPage } from '/js/pages/login.js';
    initLoginPage();
  </script>
</body>
</html>
